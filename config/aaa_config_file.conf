server {
	listen 8080;
	server_name www.example.com;
	error_page 400 /req_error.html;
	index index.html;
	client_max_body_size 1000000000000;
	root	./error_web;
	client_header_timeout 10ms;
    client_body_timeout 10ms;
    send_timeout 10ms;
    keepalive_timeout 10ms;
	location / {
		allow_methods GET POST DELETE;
		root ./www;
		index index.html;
		autoindex on;
upload_store ./www/uploads;
	}
location /test_delete {
    allow_methods GET DELETE;
    root ./www/delete_test;
}
	location /src_path {
		root ./www;
		cgi .py /excev_path;
	}
	location /src_redirect {
		allow_methods GET DELETE;
		return 301 /my_web.html;
	}
}

server {
	listen 8081 default_server;
	server_name example.com;
	root ./www;
	client_header_timeout 1ms;
	client_body_timeout 1ms;
	send_timeout 1ms;
	keepalive_timeout 1ms;
}
