server {
	listen 127.0.0.1:8080;
	server_name www.example.com;
	error_page 400 /req_error.html;
	error_page 401 403 404 /error.html;
	index index.html;
	client_max_body_size 10000;
	root	/home;
	client_header_timeout 10ms;
    client_body_timeout 10ms;
    send_timeout 10ms;
    keepalive_timeout 10ms;
	location / {
		allow_methods GET DELETE;
		root ./www;
		index index.html;
		autoindex on;
		upload_store /home/mcuenca-/42/webserver/upload;
	}
	location /src_path {
		root /home/mcuenca-/root;
		cgi .py /excev_path;
	}
	location /src_redirect {
		return 305 /proxy.html;
	}
}

server {
	listen 8081 default_server;
	server_name example.com;
	root ./www;
	client_header_timeout 1ms;
	client_body_timeout 1ms;
	send_timeout 1ms;
	keepalive_timeout 1ms;
}
