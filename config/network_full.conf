

server {
    listen 8081;
    server_name localhost;

    root ./website2;
    index index.html;

    client_max_body_size 5M;

    error_page 404 ./website2/errors/404.html;

    location / {
        methods GET;
        index index.html;
    }

    location /images {
        methods GET;
        root ./website2;
        autoindex off;
    }

    location /directory {
        methods GET;
        root ./website2;
        autoindex on;
     }
}


   

   
# ============================================================
# SERVER 2 - OTRO SERVIDOR / OTRO PUERTO
# ============================================================


server {
    listen 8080;
    server_name localhost;

    root ./www;
    index index.html;

    client_max_body_size 10M;

    error_page 404 ./www/errors/404.html;
    error_page 403 ./www/errors/403.html;
    error_page 405 ./www/errors/405.html;
    error_page 500 ./www/errors/500.html;

    # --------------------------------------------------------
    # Página principal
    # --------------------------------------------------------

    location / {
        methods GET POST DELETE;
        index index.html;
    }

    # --------------------------------------------------------
    # Archivos estáticos
    # --------------------------------------------------------

    location /static {
        methods GET;
        root ./www;
        autoindex off;
    }

    # --------------------------------------------------------
    # Directorio navegable
    # --------------------------------------------------------

    location /files {
        methods GET;
        root ./www;
        autoindex on;
    }

    # --------------------------------------------------------
    # Uploads
    # --------------------------------------------------------

    location /upload {
        methods GET POST DELETE;
        root ./www;
        upload_store ./www/uploads;
    }

    # --------------------------------------------------------
    # CGI
    # --------------------------------------------------------

    location /cgi-bin {
        methods GET POST;
        root ./www;
        cgi .py /usr/bin/python3;
    }

    # --------------------------------------------------------
    # Redirección
    # --------------------------------------------------------

    location /google {
        return 301 https://www.google.com;
    }
}





# ============================================================
# SERVER 3 - SERVIDOR PARA PROBAR MÉTODOS HTTP
# ============================================================

server {
    listen 8082;
    server_name methods.localhost;

    root ./method_test;
    index index.html;

    # Solo GET
    location /get {
        methods GET;
    }

    # Solo POST
    location /post {
        methods POST;
    }

    # Solo DELETE
    location /delete {
        methods DELETE;
    }

    # GET + POST
    location /form {
        methods GET POST;
    }

    # GET + POST + DELETE
    location /all {
        methods GET POST DELETE;
    }
}


# ============================================================
# SERVER 4 - SERVIDOR PARA PROBAR CGI
# ============================================================

server {
    listen 8083;
    server_name cgi.localhost;

    root ./cgi_www;
    index index.html;

    client_max_body_size 10M;

    error_page 404 ./cgi_www/errors/404.html;

    location / {
        methods GET;
        index index.html;
    }

    # Python CGI
    location /cgi-bin {
        methods GET POST;
        cgi .py /usr/bin/python3;
    }

    # Otro directorio CGI
    location /scripts {
        methods GET POST;
        cgi .py /usr/bin/python3;
    }
}


# ============================================================
# SERVER 5 - SERVIDOR PARA TESTING DE ERRORES
# ============================================================

server {
    listen 8084;
    server_name errors.localhost;

    root ./errors_www;
    index index.html;

    error_page 400 ./errors_www/400.html;
    error_page 403 ./errors_www/403.html;
    error_page 404 ./errors_www/404.html;
    error_page 405 ./errors_www/405.html;
    error_page 413 ./errors_www/413.html;
    error_page 500 ./errors_www/500.html;

    location / {
        methods GET;
    }

    location /protected {
        methods GET;
    }
}


# ============================================================
# SERVER 6 - AUTOINDEX
# ============================================================

server {
    listen 8085;
    server_name autoindex.localhost;

    root ./autoindex_www;
    index index.html;

    location / {
        methods GET;
        autoindex on;
    }

    location /private {
        methods GET;
        autoindex off;
    }
}


