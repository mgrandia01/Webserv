<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv GET Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
        }

        h1 {
            color: darkblue;
        }

        .box {
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hola Webserv!</h1>

        <p>
            Si estás viendo esto significa que el método GET funciona correctamente.
        </p>

        <h2>Pruebas:</h2>

        <ul>
            <li>Fichero encontrado: OK</li>
            <li>Lectura del body: OK</li>
            <li>Content-Type: debería ser text/html</li>
            <li>Content-Length: debería coincidir con el tamaño del archivo</li>
        </ul>

        <p>
            Archivo servido desde:
            <strong>./www/index.html</strong>
        </p>
    </div>

</body>
</html>
